spring.application.name=auto-repair-shop

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/autorepairshop}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.security.jwt.secret=${JWT_SECRET:change-me-to-a-32-byte-or-longer-secret-key}
app.security.jwt.ttl-seconds=${JWT_TTL_SECONDS:86400}
app.security.refresh.ttl-seconds=${REFRESH_TTL_SECONDS:1209600}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=${MAIL_FROM:oficina@localhost}
app.mail.invite-base-url=${INVITE_BASE_URL:http://localhost:8080/invite}
