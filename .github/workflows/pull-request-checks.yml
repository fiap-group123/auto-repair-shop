name: Pull Request Checks

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          java-version: ${{ vars.JAVA_VERSION }}
          gradle-version: ${{ vars.GRADLE_VERSION }}

      - name: Compile Kotlin
        run: ./gradlew compileKotlin

      - name: Detekt
        run: ./gradlew detektMain

      - name: Upload Detekt Report
        uses: actions/upload-artifact@v7
        with:
          name: "detekt-report"
          if-no-files-found: error
          retention-days: 1
          path: build/reports/detekt/detekt.sarif

  unit-tests:
    runs-on: ubuntu-latest
    needs: build-project
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          java-version: ${{ vars.JAVA_VERSION }}
          gradle-version: ${{ vars.GRADLE_VERSION }}

      - name: Run tests
        env:
          JWT_SECRET: ci-test-jwt-secret-key-of-32-bytes-min
          DATABASE_PASSWORD: postgres
        run: ./gradlew koverVerify koverXmlReport koverHtmlReport

      - name: Extract coverage percentage
        id: extract-coverage-percentage
        run: python3 .github/scripts/extract-coverage-percentage.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        id: upload-coverage-report
        with:
          name: coverage-report
          path: build/reports/kover/html

      - name: Upload Kover Report and Classes
        uses: actions/upload-artifact@v7
        with:
          name: kover-report-classes
          if-no-files-found: error
          retention-days: 1
          path: |
            build/reports/kover/report.xml
            build/classes/

    outputs:
      coverage-report-url: ${{ steps.upload-coverage-report.outputs.artifact-url }}
      coverage-percentage: ${{ steps.extract-coverage-percentage.outputs.percentage }}

  sonar:
    runs-on: ubuntu-latest
    needs: [build-project, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base branch for Sonar
        run: |
          BASE_REF="${{ github.base_ref || github.event.repository.default_branch }}"
          git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          java-version: ${{ vars.JAVA_VERSION }}
          gradle-version: ${{ vars.GRADLE_VERSION }}

      - name: Download Detekt Report
        uses: actions/download-artifact@v7
        with:
          name: "detekt-report"
          path: build/reports/detekt

      - name: Download Kover Report and Classes
        uses: actions/download-artifact@v7
        with:
          name: kover-report-classes
          path: .

      - name: Place Sonar inputs
        run: |
          set -euo pipefail
          mkdir -p build/reports/kover build/reports/detekt
          if [ ! -f build/reports/detekt/detekt.sarif ]; then
            SARIF=$(find . -name 'detekt.sarif' | head -n 1)
            test -n "$SARIF"
            cp "$SARIF" build/reports/detekt/detekt.sarif
          fi
          if [ ! -f build/reports/kover/report.xml ]; then
            XML=$(find . -name 'report.xml' | head -n 1)
            test -n "$XML"
            cp "$XML" build/reports/kover/report.xml
          fi
          ls -la build/reports/kover build/reports/detekt
          test -f build/reports/kover/report.xml
          test -f build/reports/detekt/detekt.sarif
          test -d build/classes/kotlin/main

      - name: SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar -x test -x koverXmlReport -x koverVerify -x detektMain -x detekt

  notify-coverage:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: success() && github.event_name == 'pull_request' && needs.unit-tests.outputs.coverage-report-url != ''
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Replace coverage comment on this PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COVERAGE_PERCENTAGE: ${{ needs.unit-tests.outputs.coverage-percentage }}
          COVERAGE_REPORT_URL: ${{ needs.unit-tests.outputs.coverage-report-url }}
        run: |
          MARKER='<!-- coverage-comment -->'

          comment_ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${MARKER}\"))) | .id] | .[]")

          for id in $comment_ids; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${id}"
          done

          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body "${MARKER}
          ## Unit Tests Coverage

          **Unit Tests Coverage:** ${COVERAGE_PERCENTAGE}%

          [Unit Tests Coverage Report](${COVERAGE_REPORT_URL})"
