name: Pull Request Checks

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          java-version: ${{ vars.JAVA_VERSION }}
          gradle-version: ${{ vars.GRADLE_VERSION }}

      - name: Compile Kotlin
        run: ./gradlew compileKotlin

      - name: Detekt
        run: ./gradlew detektMain

      - name: SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar

  unit-tests:
    runs-on: ubuntu-latest
    needs: build-project
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          java-version: ${{ vars.JAVA_VERSION }}
          gradle-version: ${{ vars.GRADLE_VERSION }}

      - name: Run tests
        env:
          JWT_SECRET: ci-test-jwt-secret-key-of-32-bytes-min
          DATABASE_PASSWORD: postgres
        run: ./gradlew koverVerify koverXmlReport koverHtmlReport

      - name: Extract coverage percentage
        id: extract-coverage-percentage
        run: python3 .github/scripts/extract-coverage-percentage.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        id: upload-coverage-report
        with:
          name: coverage-report
          path: build/reports/kover/html

    outputs:
      coverage-report-url: ${{ steps.upload-coverage-report.outputs.artifact-url }}
      coverage-percentage: ${{ steps.extract-coverage-percentage.outputs.percentage }}
  
  notify-coverage:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: success() && github.event_name == 'pull_request' && needs.unit-tests.outputs.coverage-report-url != ''
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Replace coverage comment on this PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COVERAGE_PERCENTAGE: ${{ needs.unit-tests.outputs.coverage-percentage }}
          COVERAGE_REPORT_URL: ${{ needs.unit-tests.outputs.coverage-report-url }}
        run: |
          MARKER='<!-- coverage-comment -->'

          comment_ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${MARKER}\"))) | .id] | .[]")

          for id in $comment_ids; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${id}"
          done

          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body "${MARKER}
          ## Unit Tests Coverage

          **Unit Tests Coverage:** ${COVERAGE_PERCENTAGE}%

          [Unit Tests Coverage Report](${COVERAGE_REPORT_URL})"