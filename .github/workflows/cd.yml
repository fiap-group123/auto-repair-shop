name: CD

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: "${{ !contains(github.event.head_commit.message, 'chore: record published image') }}"
    permissions:
      contents: read
      actions: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/pull-request-checks.yml

  deliver:
    needs: verify
    if: "${{ needs.verify.result == 'success' && !contains(github.event.head_commit.message, 'chore: record published image') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    env:
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'auto-repair-shop' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Skip a push that only records the published tag
        id: gate
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [[ -z "$latest" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$latest" HEAD)
          if [[ "$changed" == "k8s/app/kustomization.yaml" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "This push only stores the published image tag."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.gate.outputs.skip != 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Ensure ECR public repository
        if: steps.gate.outputs.skip != 'true'
        run: |
          aws ecr-public describe-repositories --region us-east-1 --repository-names "$ECR_REPOSITORY" \
            || aws ecr-public create-repository --region us-east-1 --repository-name "$ECR_REPOSITORY"

      - name: Image version
        if: steps.gate.outputs.skip != 'true'
        id: image
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          else
            latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            if [[ -n "$BUMP" ]]; then
              level="$BUMP"
            else
              if [[ -n "$latest" ]]; then
                log=$(git log "${latest}..HEAD" --format='%s%n%b')
              else
                log=$(git log -1 --format='%s%n%b')
              fi
              if echo "$log" | grep -Eq '(^|[[:space:]])[a-zA-Z]+(\([^)]+\))?!:|BREAKING[[:space:]]CHANGE'; then
                level=major
              elif echo "$log" | grep -Eq '(^|[[:space:]])feat(\([^)]+\))?:'; then
                level=minor
              else
                level=patch
              fi
            fi
            if [[ -z "$latest" ]]; then
              if [[ "$level" == "major" ]]; then
                version="v1.0.0"
              else
                version="v0.1.0"
              fi
            else
              ver="${latest#v}"
              major="${ver%%.*}"
              rest="${ver#*.}"
              minor="${rest%%.*}"
              patch="${rest#*.}"
              case "$level" in
                major) version=$(printf 'v%d.0.0' "$((major + 1))") ;;
                minor) version=$(printf 'v%d.%d.0' "$major" "$((minor + 1))") ;;
                *) version=$(printf 'v%d.%d.%d' "$major" "$minor" "$((patch + 1))") ;;
              esac
            fi
            echo "level=$level" >> "$GITHUB_OUTPUT"
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          registry=$(aws ecr-public describe-registries --region us-east-1 --query 'registries[0].registryUri' --output text)
          echo "name=${registry}/$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "Resolved ${registry}/$ECR_REPOSITORY:$version"

      - name: Build image
        if: steps.gate.outputs.skip != 'true'
        run: |
          docker build \
            --label "org.opencontainers.image.version=${{ steps.image.outputs.version }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" .

      - name: Push image
        if: steps.gate.outputs.skip != 'true'
        run: |
          docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}"
          if [[ "${{ steps.image.outputs.create_release }}" == "true" ]]; then
            docker tag "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" "${{ steps.image.outputs.name }}:latest"
            docker push "${{ steps.image.outputs.name }}:latest"
          fi
          echo "Published ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}"

      - name: Record published version
        if: steps.gate.outputs.skip != 'true' && steps.image.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i -E "s/^([[:space:]]*newTag:).*/\\1 ${VERSION}/" k8s/app/kustomization.yaml
          git add k8s/app/kustomization.yaml
          if git diff --cached --quiet; then
            echo "newTag already ${VERSION}"
            exit 0
          fi
          git commit -m "chore: record published image ${VERSION}"
          git push origin HEAD:main

      - name: Publish Git tag and release
        if: steps.gate.outputs.skip != 'true' && steps.image.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.image.outputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
          else
            git tag -a "$VERSION" -m "Release $VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/$VERSION"
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
            exit 0
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes "Imagem Docker: ${IMAGE}"

      - name: Install kind
        if: steps.gate.outputs.skip != 'true'
        run: |
          curl -fsSL -o kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version

      - name: Install kubectl
        if: steps.gate.outputs.skip != 'true'
        run: |
          version="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSL -o kubectl "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Setup Terraform
        if: steps.gate.outputs.skip != 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Ensure Terraform state bucket
        if: steps.gate.outputs.skip != 'true'
        run: bash scripts/ensure-tfstate-bucket.sh

      - name: Provision cluster and database
        if: steps.gate.outputs.skip != 'true'
        working-directory: infra
        run: |
          terraform init
          if ! kind get clusters | grep -qx autorepairshop; then
            terraform state rm kind_cluster.auto_repair_shop || true
            terraform state rm null_resource.metrics_server || true
            terraform state rm null_resource.database || true
          fi
          terraform apply -auto-approve

      - name: Apply manifests
        if: steps.gate.outputs.skip != 'true'
        run: |
          kubectl apply -k k8s --context kind-autorepairshop
          kubectl --context kind-autorepairshop -n auto-repair-shop set image deployment/api \
            api="${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}"
          if ! kubectl --context kind-autorepairshop -n auto-repair-shop rollout status deployment/api --timeout=300s; then
            kubectl --context kind-autorepairshop -n auto-repair-shop get pods
            kubectl --context kind-autorepairshop -n auto-repair-shop describe pods
            kubectl --context kind-autorepairshop -n auto-repair-shop logs -l app=api --tail=200 || true
            exit 1
          fi

      - name: Smoke test
        if: steps.gate.outputs.skip != 'true'
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health/readiness; then
              echo
              exit 0
            fi
            sleep 5
          done
          exit 1
