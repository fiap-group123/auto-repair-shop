services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autorepairshop
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d autorepairshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/autorepairshop
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-32-byte-or-longer-secret-key}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-900}
      REFRESH_TTL_SECONDS: ${REFRESH_TTL_SECONDS:-1209600}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-oficina@localhost}
      INVITE_BASE_URL: ${INVITE_BASE_URL:-http://localhost:8080/invite}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: on-failure

volumes:
  postgres_data:
